[project]
name = "meeting-recorder"
version = "0.1.0"
description = "Grabador de reuniones multiplataforma: video (ventana/pantalla) + audio del sistema + micrófono"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "PyAudioWPatch>=0.2.12.7 ; sys_platform == 'win32'",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "imageio-ffmpeg>=0.4.9",
]

[project.scripts]
meeting-recorder = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
