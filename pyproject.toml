[project]
name = "meeting-recorder"
version = "0.1.0"
description = "Grabador de reuniones multiplataforma: video (ventana/pantalla) + audio del sistema + micrófono"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
meeting-recorder = "app.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"app.ui" = ["qml/*.qml", "qml/qmldir"]
